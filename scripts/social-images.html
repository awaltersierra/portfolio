<!doctype html>
<!--
  Plantilla para regenerar las imágenes de public/ (con `pnpm dev` corriendo):
  - http://localhost:5173/scripts/social-images.html#og    → captura 1200×630, convertir a JPEG → public/og-image.jpg
  - http://localhost:5173/scripts/social-images.html#icon  → captura 180×180  → public/apple-touch-icon.png
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Imágenes sociales</title>
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: #020618;
        color: #f8fafc;
      }
      .og,
      .icon {
        display: none;
      }
      body.mode-og .og,
      body.mode-icon .icon {
        display: flex;
      }
      .og {
        width: 1200px;
        height: 630px;
        padding: 72px 80px;
        align-items: center;
        gap: 72px;
        background:
          radial-gradient(circle at 85% 20%, rgb(99 102 241 / 0.25), transparent 45%), #020618;
      }
      .og .text {
        flex: 1;
      }
      .og .eyebrow {
        color: #818cf8;
        font-size: 28px;
        font-weight: 600;
      }
      .og h1 {
        margin-top: 12px;
        font-size: 84px;
        line-height: 1;
        letter-spacing: -2px;
      }
      .og .role {
        margin-top: 20px;
        font-size: 40px;
        color: #cbd5e1;
        font-weight: 500;
      }
      .og .stack {
        margin-top: 40px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .og .stack span {
        padding: 8px 16px;
        border-radius: 10px;
        background: rgb(148 163 184 / 0.12);
        border: 1px solid rgb(148 163 184 / 0.25);
        font-size: 24px;
        color: #e2e8f0;
      }
      .og img {
        width: 320px;
        height: 480px;
        object-fit: cover;
        border-radius: 28px;
        box-shadow: 0 25px 50px rgb(0 0 0 / 0.5);
      }
      .icon {
        width: 180px;
        height: 180px;
        align-items: center;
        justify-content: center;
        font-size: 84px;
        font-weight: 700;
        letter-spacing: -2px;
        background: #0f172a;
      }
      .icon span {
        color: #818cf8;
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div class="text">
        <p class="eyebrow">Portfolio</p>
        <h1>Walter Sierra</h1>
        <p class="role">Desarrollador Full Stack · +10 años en IT</p>
        <div class="stack">
          <span>React</span><span>TypeScript</span><span>Node.js</span><span>Django</span
          ><span>MySQL</span><span>Docker</span>
        </div>
      </div>
      <img src="/profile.webp" alt="" />
    </div>
    <div class="icon">WS<span>.</span></div>
    <script>
      const applyMode = () => (document.body.className = 'mode-' + (location.hash.slice(1) || 'og'))
      applyMode()
      addEventListener('hashchange', applyMode)
    </script>
  </body>
</html>
