name: Deploy a GitHub Pages

# Cada push a main valida (lint, formato, tipos, tests) y publica; los PR solo validan
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un deploy a la vez; no se cancela uno en curso para no dejar Pages a medio publicar
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Versión de pnpm tomada de "packageManager" en package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint, formato y tipos
        run: |
          pnpm lint
          pnpm format:check
          pnpm exec tsc -b

      - run: pnpm test

      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      # SITE_URL habilita og:image, og:url y canonical con URLs absolutas (ver vite.config.ts)
      - name: Build (con pre-render)
        run: pnpm build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
