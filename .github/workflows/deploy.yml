name: Deploy a GitHub Pages

# Cada push a main valida (lint, formato, tipos, tests unitarios y E2E) y publica;
# los PR (incluidos los de Dependabot) solo validan
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un deploy a la vez; no se cancela uno en curso para no dejar Pages a medio publicar
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions fijadas por hash de commit (no por tag, que puede moverse); Dependabot las actualiza
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Versión de pnpm tomada de "packageManager" en package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint, formato y tipos
        run: |
          pnpm lint
          pnpm format:check
          pnpm exec tsc -b

      - run: pnpm test

      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # SITE_URL habilita og:image, og:url y canonical con URLs absolutas (ver vite.config.ts)
      - name: Build (con pre-render y CV)
        run: pnpm build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      # E2E sobre el build real: pre-render + hidratación (es/en), rutas y descarga del CV
      - name: Instalar Chromium para Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests E2E
        run: pnpm test:e2e

      - name: Reporte de Playwright (si fallan los E2E)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
